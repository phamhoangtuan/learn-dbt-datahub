# DataHub ingestion recipe for dbt Medallion Pipeline
# Ingests metadata (models, lineage, tests) from local dbt artifacts into DataHub.
#
# Prerequisites:
#   - DataHub running: make datahub-up  (UI at localhost:9002, GMS at localhost:8080)
#   - dbt artifacts present: make transform  (generates target/manifest.json etc.)
#
# Note: catalog.json is omitted — dbt docs generate queries information_schema
# which the DuckDB-backed emulator does not support.
#
# Run via: make datahub-ingest

source:
  type: dbt
  config:
    manifest_path: "dbt_project/target/manifest.json"
    run_results_paths:
      - "dbt_project/target/run_results.json"
    target_platform: "snowflake"
    include_column_lineage: true

sink:
  type: datahub-rest
  config:
    server: "http://localhost:8080"
